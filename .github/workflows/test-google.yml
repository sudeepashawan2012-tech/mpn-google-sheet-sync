name: Test Google Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google libraries
        run: pip install google-auth google-api-python-client

      - name: Check Google authorization and Sheet access
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          try:
              credentials = Credentials.from_authorized_user_info(
                  json.loads(os.environ["GOOGLE_TOKEN_JSON"])
              )
              credentials.refresh(Request())

              service = build(
                  "sheets", "v4",
                  credentials=credentials,
                  cache_discovery=False
              )
              result = service.spreadsheets().get(
                  spreadsheetId=os.environ["GOOGLE_SHEET_ID"].strip(),
                  fields="properties(title)"
              ).execute()

              print("Google authorization: SUCCESS")
              print("Sheet access: SUCCESS")
              print("Sheet title:", result["properties"]["title"])
          except Exception as error:
              print("Connection test FAILED:", type(error).__name__)
              print("Check token validity, Sheet ID, account access and enabled API.")
              sys.exit(1)
          PY
