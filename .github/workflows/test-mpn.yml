name: Test MPN Login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test portal login
        env:
          MPN_USERNAME: ${{ secrets.MPN_USERNAME }}
          MPN_PASSWORD: ${{ secrets.MPN_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright

          stage = "Start browser"
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  page = browser.new_page()
                  page.set_default_timeout(45000)

                  stage = "Login"
                  page.goto(
                      "https://mpn.malabargroup.com/Dashboard.aspx",
                      wait_until="domcontentloaded"
                  )
                  page.get_by_role(
                      "textbox", name="Username", exact=True
                  ).fill(os.environ["MPN_USERNAME"])
                  page.get_by_role(
                      "textbox", name="Password", exact=True
                  ).fill(os.environ["MPN_PASSWORD"])
                  page.get_by_role(
                      "button", name="login", exact=True
                  ).click()
                  page.wait_for_url("**/Dashboard.aspx")

                  if page.get_by_role(
                      "textbox", name="Password", exact=True
                  ).is_visible():
                      raise RuntimeError("Login form still visible")
                  print("MPN login: SUCCESS")

                  stage = "Open Order List"
                  page.goto(
                      "https://mpn.malabargroup.com/OrderList.aspx",
                      wait_until="domcontentloaded"
                  )
                  if urlsplit(page.url).path.lower() != "/orderlist.aspx":
                      raise RuntimeError("Order List not reached")
                  print("Order List opened: SUCCESS")

                  stage = "Wait for order-type options"
                  page.wait_for_function(
                      """() => {
                          const e = document.getElementById('ddlOrderType');
                          return e && e.options.length > 1;
                      }""",
                      timeout=45000
                  )

                  for title, selector in [
                      ("ORDER TYPE OPTIONS", "#ddlOrderType"),
                      ("PAGE LIMIT OPTIONS", "#asdaddlpagelimit"),
                  ]:
                      print(title + ":")
                      options = page.locator(
                          selector + " option"
                      ).evaluate_all(
                          """items => items.map(o => ({
                              label: o.textContent.trim(),
                              value: o.value
                          }))"""
                      )
                      print(json.dumps(options, indent=2))

                  browser.close()

          except Exception as error:
              print("FAILED at stage:", stage)
              print("Error type:", type(error).__name__)
              sys.exit(1)
          PY
