name: Test MPN Login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect Order List
        env:
          MPN_USERNAME: ${{ secrets.MPN_USERNAME }}
          MPN_PASSWORD: ${{ secrets.MPN_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright

          stage = "Login"
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  page = browser.new_page()
                  page.set_default_timeout(45000)
                  page.goto(
                      "https://mpn.malabargroup.com/Dashboard.aspx",
                      wait_until="domcontentloaded"
                  )
                  page.get_by_role(
                      "textbox", name="Username", exact=True
                  ).fill(os.environ["MPN_USERNAME"])
                  page.get_by_role(
                      "textbox", name="Password", exact=True
                  ).fill(os.environ["MPN_PASSWORD"])
                  page.get_by_role(
                      "button", name="login", exact=True
                  ).click()
                  page.wait_for_url("**/Dashboard.aspx")
                  if page.get_by_role(
                      "textbox", name="Password", exact=True
                  ).is_visible():
                      raise RuntimeError("Login form still visible")
                  print("Login: SUCCESS")

                  stage = "Open Order List"
                  page.goto(
                      "https://mpn.malabargroup.com/OrderList.aspx",
                      wait_until="domcontentloaded"
                  )
                  if urlsplit(page.url).path.lower() != "/orderlist.aspx":
                      raise RuntimeError("Order List not reached")

                  page.wait_for_function(
                      """() => {
                          const e = document.getElementById('ddlOrderType');
                          return e && e.options.length > 1;
                      }"""
                  )

                  stage = "Wait for larger page limits"
                  try:
                      page.wait_for_function(
                          """() => {
                              const e = document.getElementById(
                                  'asdaddlpagelimit'
                              );
                              return e && [...e.options].some(
                                  o => Number(o.value) > 100
                              );
                          }""",
                          timeout=20000
                      )
                  except Exception:
                      print("Larger limits not present before filtering.")

                  print("PAGE LIMIT OPTIONS:")
                  print(json.dumps(
                      page.locator(
                          "#asdaddlpagelimit option"
                      ).evaluate_all(
                          """items => items.map(o => ({
                              label: o.textContent.trim(),
                              value: o.value
                          }))"""
                      ),
                      indent=2
                  ))

                  stage = "Inspect relevant buttons"
                  print("FILTER AND DOWNLOAD CONTROLS:")
                  print(json.dumps(
                      page.locator(
                          "button, a, input[type='button'], "
                          "input[type='submit']"
                      ).evaluate_all(
                          """items => items.map(e => ({
                              tag: e.tagName,
                              id: e.id,
                              text: (
                                  e.tagName === 'INPUT'
                                  ? e.value : e.textContent
                              ).trim().replace(/\\s+/g, ' '),
                              title: e.getAttribute('title') || '',
                              aria: e.getAttribute('aria-label') || '',
                              visible: !!e.getClientRects().length
                          })).filter(e =>
                              /^(filter|download excel|next|previous|reset)$/i
                                  .test(e.text)
                              || /^(next|previous)$/i.test(e.title)
                              || /^(next|previous)$/i.test(e.aria)
                          )"""
                      ),
                      indent=2
                  ))

                  print("TABLE HEADER CHECKBOXES:")
                  print(json.dumps(
                      page.locator(
                          "thead input[type='checkbox'], "
                          "th input[type='checkbox']"
                      ).evaluate_all(
                          """items => items.map(e => ({
                              id: e.id,
                              name: e.name,
                              class: e.className
                          }))"""
                      ),
                      indent=2
                  ))
                  browser.close()

          except Exception as error:
              print("FAILED at stage:", stage)
              print("Error type:", type(error).__name__)
              sys.exit(1)
          PY
