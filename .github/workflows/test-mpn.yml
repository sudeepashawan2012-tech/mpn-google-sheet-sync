name: Test MPN Login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test Stock Order filter
        env:
          MPN_USERNAME: ${{ secrets.MPN_USERNAME }}
          MPN_PASSWORD: ${{ secrets.MPN_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from playwright.sync_api import sync_playwright

          stage = "Login"
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  page = browser.new_page()
                  page.set_default_timeout(45000)
                  page.goto(
                      "https://mpn.malabargroup.com/Dashboard.aspx",
                      wait_until="domcontentloaded"
                  )
                  page.get_by_role(
                      "textbox", name="Username", exact=True
                  ).fill(os.environ["MPN_USERNAME"])
                  page.get_by_role(
                      "textbox", name="Password", exact=True
                  ).fill(os.environ["MPN_PASSWORD"])
                  page.get_by_role(
                      "button", name="login", exact=True
                  ).click()
                  page.wait_for_url("**/Dashboard.aspx")
                  if page.get_by_role(
                      "textbox", name="Password", exact=True
                  ).is_visible():
                      raise RuntimeError("Login form still visible")
                  print("Login: SUCCESS")

                  stage = "Open Order List"
                  page.goto(
                      "https://mpn.malabargroup.com/OrderList.aspx",
                      wait_until="domcontentloaded"
                  )
                  page.wait_for_function(
                      """() => {
                          const e = document.getElementById('ddlOrderType');
                          return e && [...e.options].some(
                              o => o.value === '2'
                          );
                      }"""
                  )

                  stage = "Select Stock Order"
                  page.locator("#ddlOrderType").select_option(
                      "2", force=True
                  )
                  selected = page.locator(
                      "#ddlOrderType"
                  ).evaluate(
                      "e => [...e.selectedOptions].map(o => o.value)"
                  )
                  if selected != ["2"]:
                      raise RuntimeError("Unexpected order-type selection")
                  print("Stock Order selected: SUCCESS")

                  stage = "Apply filter"
                  page.locator("#Orderfilter").click()
                  try:
                      page.wait_for_load_state(
                          "networkidle", timeout=45000
                      )
                  except Exception:
                      print("Network remained busy; inspecting current page.")

                  stage = "Inspect filtered page"
                  body = page.locator("body").inner_text()
                  counts = re.findall(
                      r"[\d,]+\s+items?\s+found", body, re.I
                  )
                  print("DISPLAYED COUNTS:", counts)

                  print("PAGE-SIZE CONTROLS:")
                  print(json.dumps(
                      page.locator("select").evaluate_all(
                          """items => items.filter(e =>
                              /page|limit|length/i.test(e.id + ' ' + e.name)
                          ).map(e => ({
                              id: e.id,
                              name: e.name,
                              options: [...e.options].map(o => ({
                                  label: o.textContent.trim(),
                                  value: o.value
                              }))
                          }))"""
                      ),
                      indent=2
                  ))

                  print("EXPORT CONTROLS:")
                  print(json.dumps(
                      page.locator(
                          "button, a, input[type='button'], "
                          "input[type='submit']"
                      ).evaluate_all(
                          """items => items.map(e => ({
                              tag: e.tagName,
                              id: e.id,
                              text: (
                                  e.tagName === 'INPUT'
                                  ? e.value : e.textContent
                              ).trim().replace(/\\s+/g, ' '),
                              title: e.getAttribute('title') || '',
                              visible: !!e.getClientRects().length
                          })).filter(e =>
                              /excel|download|export/i.test(e.text)
                              && e.text.length < 100
                          )"""
                      ),
                      indent=2
                  ))

                  print("TABLE STRUCTURE:")
                  print(json.dumps(
                      page.locator("table").evaluate_all(
                          """items => items.map(e => ({
                              id: e.id,
                              visible: !!e.getClientRects().length,
                              rows: e.querySelectorAll('tbody tr').length,
                              headerCheckboxes: [
                                  ...e.querySelectorAll(
                                      'thead input[type="checkbox"], '
                                      + 'th input[type="checkbox"]'
                                  )
                              ].map(c => ({id: c.id}))
                          }))"""
                      ),
                      indent=2
                  ))
                  browser.close()

          except Exception as error:
              print("FAILED at stage:", stage)
              print("Error type:", type(error).__name__)
              sys.exit(1)
          PY
